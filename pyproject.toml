[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "globbook-auth"
version = "1.1.0"
description = "Official Python SDK for \"Sign in with Globbook\" (OAuth 2.0 authorization-code flow)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Nibub" }]
requires-python = ">=3.9"
keywords = ["globbook", "oauth", "oauth2", "sign in with globbook", "authentication", "sdk"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/nibub-labs/globbook-auth-python"
Repository = "https://github.com/nibub-labs/globbook-auth-python"
Issues = "https://github.com/nibub-labs/globbook-auth-python/issues"
Changelog = "https://github.com/nibub-labs/globbook-auth-python/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
globbookauth = ["py.typed"]

[tool.mypy]
python_version = "3.9"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
